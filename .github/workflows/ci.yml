name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: SDK is patched for free mode
        run: node -e "import('./scripts/patch-sdk.mjs').then(m => { if (!m.isSdkPatched()) { console.error('SDK not patched after npm ci'); process.exit(1) } })"
      - run: npm run check
